    <!--
      COI Service Worker: injects COOP/COEP headers so SharedArrayBuffer
      (required by Shen.AI's threaded WASM) works on hosts that don't
      set those headers themselves (e.g. Lovable preview).
    -->
    <script>
      (function () {
        if (typeof window === "undefined") return;
        if (window.crossOriginIsolated) return;

        // Skip inside iframes (Lovable preview, embeds, etc.). The COI service
        // worker forces a reload when it activates — inside an iframe that
        // creates a load loop and the preview never reports "ready".
        // The Shen.AI scan is gated separately and won't run in embedded contexts.
        try {
          if (window.self !== window.top) return;
        } catch (_) {
          return;
        }

        if (!window.isSecureContext) {
          console.warn("[coi-sw] insecure context, COOP/COEP will not work");
          return;
        }
        if (!("serviceWorker" in navigator)) {
          console.warn("[coi-sw] service workers not supported");
          return;
        }

        var reloaded = false;
        function reloadOnce() {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        }

        navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);

        navigator.serviceWorker
          .register("/coi-serviceworker.js", { scope: "/" })
          .then(function (reg) {
            if (navigator.serviceWorker.controller && !window.crossOriginIsolated) {
              reloadOnce();
              return;
            }
            if (!navigator.serviceWorker.controller) {
              var sw = reg.installing || reg.waiting || reg.active;
              if (sw) {
                sw.addEventListener("statechange", function () {
                  if (sw.state === "activated") reloadOnce();
                });
              }
            }
          })
          .catch(function (e) {
            console.error("[coi-sw] register failed", e);
          });
      })();
    </script>
